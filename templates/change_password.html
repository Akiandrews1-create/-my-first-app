<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password</title>

<style>
body {
    background: #0b1220;
    color: white;
    font-family: Arial;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.card {
    background: #1e293b;
    padding: 30px;
    border-radius: 16px;
    width: 320px;
}

input, button {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 10px;
    border: none;
}

button {
    background: #3b82f6;
    color: white;
    cursor: pointer;
}

.error {
    color: red;
    text-align: center;
}

.success {
    color: #22c55e;
    text-align: center;
}
</style>
</head>

<body>

<div class="card">
    <h2>Change Password</h2>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    {% if success %}
        <div class="success">{{ success }}</div>
    {% endif %}

    <form method="POST">
        <input type="password" name="old_password" placeholder="Old Password" required>
        <input type="password" name="new_password" placeholder="New Password" required>
        <button>Update Password</button>
    </form>

    <a href="/profile">
        <button style="background:#64748b;">Back</button>
    </a>
</div>

</body>
</html>
