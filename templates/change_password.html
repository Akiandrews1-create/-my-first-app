<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password</title>

<style>
* { box-sizing: border-box; }

body {
    background: #0b1220;
    color: white;
    font-family: Inter, -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
}

.card {
    background: rgba(17, 24, 39, 0.85);
    padding: 30px;
    border-radius: 20px;
    width: 100%;
    max-width: 420px;
}

h2 {
    margin-top: 0;
}

input, button {
    width: 100%;
    padding: 12px;
    margin: 10px 0;
    border-radius: 10px;
    border: none;
    font-size: 16px;
}

input {
    background: #1e293b;
    color: white;
    border: 1px solid #334155;
}

button {
    background: #3b82f6;
    color: white;
    cursor: pointer;
    font-weight: 700;
}

.error {
    color: #fca5a5;
    margin-bottom: 10px;
}

.success {
    color: #86efac;
    margin-bottom: 10px;
}

.back-btn {
    display: inline-block;
    width: 100%;
    text-align: center;
    text-decoration: none;
    padding: 12px;
    margin-top: 8px;
    border-radius: 10px;
    background: #475569;
    color: white;
    font-weight: 700;
}
</style>
</head>

<body>

<div class="card">
    <h2>Change Password</h2>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    {% if success %}
        <div class="success">{{ success }}</div>
    {% endif %}

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="password" name="old_password" placeholder="Old Password" required>
        <input type="password" name="new_password" placeholder="New Password (min 8 chars)" required>
        <button type="submit">Update Password</button>
    </form>

    <a class="back-btn" href="/profile">Back to Profile</a>
</div>

</body>
</html>
