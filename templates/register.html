<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>

<style>
body {
    background:#0b1220;
    font-family: Arial;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.card {
    background:#1e293b;
    padding:30px;
    border-radius:12px;
    width:300px;
}

input {
    width:100%;
    padding:10px;
    margin-bottom:10px;
}

button {
    width:100%;
    padding:10px;
    background:#10b981;
    color:white;
    border:none;
}
</style>
</head>

<body>

<div class="card">
<h2>Register</h2>

{% if error_message %}
<p style="color:red;">{{ error_message }}</p>
{% endif %}

<form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input name="username" placeholder="Username" required>
    <input name="password" type="password" placeholder="Password" required>
    <button type="submit">Register</button>
</form>

<p><a href="/login">Login</a></p>

</div>

</body>
</html>
