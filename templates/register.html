<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Isaiah Calculator</title>

<style>
    body {
        margin: 0;
        font-family: Inter, sans-serif;
        background: #0b1220;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
    }

    .card {
        background: rgba(17, 24, 39, 0.9);
        padding: 30px;
        border-radius: 20px;
        width: 320px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        animation: fadeUp 0.6s ease;
    }

    h1 {
        text-align: center;
        margin-bottom: 20px;
    }

    input {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border-radius: 10px;
        border: 1px solid #334155;
        background: #1e293b;
        color: white;
    }

    button {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: none;
        background: #10b981;
        color: white;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }

    button:hover {
        transform: translateY(-2px);
        background: #059669;
    }

    a {
        display: block;
        text-align: center;
        margin-top: 15px;
        color: #94a3b8;
        text-decoration: none;
    }

    a:hover {
        color: white;
    }

    @keyframes fadeUp {
        from {opacity: 0; transform: translateY(20px);}
        to {opacity: 1; transform: translateY(0);}
    }
</style>
</head>

<body>
    <div class="card">
        <h1>Create Account</h1>

        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>

            <button type="submit">Register</button>
        </form>

        <a href="/login">Back to login</a>
    </div>
</body>
</html>
