<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Isaiah Calculator</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Inter, Arial, sans-serif;
            background: linear-gradient(135deg, #0b1220 0%, #111827 50%, #0f172a 100%);
            min-height: 100vh;
            display: grid;
            place-items: center;
            color: #e5e7eb;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 380px;
            background: rgba(17, 24, 39, 0.85);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.30);
        }

        h1 {
            margin: 0 0 8px;
            color: #f9fafb;
            font-size: 28px;
        }

        p {
            margin: 0 0 22px;
            color: #94a3b8;
            font-size: 14px;
        }

        input, button {
            width: 100%;
            border: none;
            outline: none;
            border-radius: 14px;
            font-size: 15px;
        }

        input {
            padding: 14px 15px;
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
            margin-bottom: 14px;
        }

        input::placeholder {
            color: #94a3b8;
        }

        button {
            padding: 14px 16px;
            font-weight: 700;
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            color: white;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(37,99,235,0.35);
        }

        button:hover {
            transform: translateY(-1px);
        }

        .bottom-text {
            margin-top: 18px;
            text-align: center;
            color: #94a3b8;
            font-size: 14px;
        }

        a {
            color: #60a5fa;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Welcome back</h1>
        <p>Login to continue using your calculator.</p>

        <form method="POST">
            <input name="username" placeholder="Username" required>
            <input name="password" type="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>

        <div class="bottom-text">
            No account? <a href="/register">Register</a>
        </div>
    </div>
</body>
</html>
